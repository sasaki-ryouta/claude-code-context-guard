[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-context-guard"
version = "0.1.1"
description = "Project-local working-state checkpoint and rehydration around Claude Code context compaction"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Intentionally empty: tests run on stdlib unittest (SPEC 3).

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
